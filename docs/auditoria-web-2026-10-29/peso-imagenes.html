<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{font-family:var(--font-sans,system-ui);color:var(--foreground);font-size:14px}
*{box-sizing:border-box}body{margin:0} .row{margin:0 0 18px}.label{display:flex;justify-content:space-between;gap:16px;margin-bottom:8px}.label b{font-variant-numeric:tabular-nums}.track{height:24px;border-radius:var(--radius,6px);background:var(--secondary);overflow:hidden}.fill{height:100%;border-radius:var(--radius,6px);background:var(--chart-1,currentColor)}.fill.second{background:var(--chart-2,currentColor);opacity:.8}.note{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin:4px 0 0}.total{font-size:16px;margin:0 0 18px}
</style></head><body>
<p class="total">Dos imágenes del inicio suman <strong>7,25 MB</strong>.</p>
<div role="img" aria-label="Peso de archivos en producción. Portada: 4,15 MB. Fogonero: 3,10 MB. Suma: 7,25 MB.">
<div class="row"><div class="label"><span>Portada</span><b>4,15 MB</b></div><div class="track"><div class="fill" style="width:92.2535%"></div></div></div>
<div class="row"><div class="label"><span>Fogonero</span><b>3,10 MB</b></div><div class="track"><div class="fill second" style="width:68.8251%"></div></div></div></div>
<p class="note">Archivos publicados, MB decimales. Se usan las mismas imágenes a 320 px de ancho.<br>No incluye las descargas de Instagram ni Google Maps.</p>
</body></html>
